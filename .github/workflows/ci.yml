name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-check:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build

      - name: Self-check
        run: swift run CodexUsageTracker --self-check
